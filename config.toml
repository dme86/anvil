# Copy this file to ~/.config/anvil/config.toml.

[general]
terminal = "foot"
startup = []

[layout]
gap = 8
outer_gap = 8
master_factor = 0.60
master_count = 1

[appearance]
background = [0.06, 0.06, 0.07, 1.0]
# The focused tile gets a small outer ring in the gap, keeping all client pixels unobscured.
# Colors use #RRGGBB; append an alpha byte (#RRGGBBAA) for a translucent border.
focus_border_color = "#707070"
focus_border_width = 2
# false asks clients not to draw title bars or window buttons. Anvil deliberately draws no
# server-side frame either, leaving tiled windows completely undecorated.
client_side_decorations = false

[keys]
modifier = "Super"
terminal = "Return"
quit = "q"
focus_next = "j"
focus_previous = "k"
swap_master = "Return"
master_grow = "l"
master_shrink = "h"
close = "c"
