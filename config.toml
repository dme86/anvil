# Copy this file to ~/.config/anvil/config.toml.

# Displays use their DRM connector names. Every field after `name` is optional: omitted displays
# keep their preferred mode, scale 1, normal orientation and automatic left-to-right placement.
# Uncomment and adapt one block per display that needs a deterministic override.
# [[outputs]]
# name = "DP-1"
# mode = "2560x1440@144"
# position = [0, 0]
# scale = 1.0
# transform = "normal" # normal, 90, 180, 270, flipped, flipped-90, flipped-180, flipped-270

[input.keyboard]
# Empty layout and variant use the system XKB defaults. Examples: layout = "de" and
# variant = "nodeadkeys".
layout = ""
variant = ""
repeat_rate = 25
repeat_delay = 200

[input.mouse]
# Uncomment either setting to override libinput's per-device defaults.
# accel_profile = "flat" # flat or adaptive
# sensitivity = 0.0 # -1.0 to 1.0

[input.touchpad]
# Uncomment either setting to override libinput's touchpad defaults.
# tap = true
# natural_scroll = true

[general]
# Alacritty is Anvil's default terminal (Super+Return). Install it separately,
# or replace the command below with your preferred terminal emulator.
terminal = "alacritty"
startup = []
# Anvil supports up to nine tags, but a compact dwm-style default starts with four.
tags = 4

# Requires a build made with `--features xwayland` and an installed Xwayland executable.
[compat]
xwayland = false

[layout]
gap = 8
outer_gap = 8
master_factor = 0.60
master_count = 1

[appearance]
background = [0.06, 0.06, 0.07, 1.0]
# The focused tile gets a small outer ring in the gap, keeping all client pixels unobscured.
# Colors use #RRGGBB; append an alpha byte (#RRGGBBAA) for a translucent border.
focus_border_color = "#707070"
focus_border_width = 2
# false asks clients not to draw title bars or window buttons. Anvil deliberately draws no
# server-side frame either, leaving tiled windows completely undecorated.
client_side_decorations = false

[bar]
# The bar is compiled in by default. Build Anvil with `cargo build --release
# --no-default-features` when no bar code or font-rasterizer dependency should be present at all.
height = 22
# Fontconfig resolves this pattern against fonts installed in the system. Use a family name such as
# "DejaVu Sans Mono" or an extended fontconfig pattern to override the default.
font = "monospace"
font_size = 16.0
# Draw one tiny, font-independent marker per window assigned to a tag. The limit prevents a busy
# tag from growing without bound; additional windows are intentionally folded into the cap.
max_window_indicators = 5
background = "#181818"
foreground = "#b8b8b8"
selected_background = "#707070"
selected_foreground = "#ffffff"
# With multiple monitors, the focused output gets a two-pixel line below its bar. The line is
# omitted entirely on a single-monitor setup. Accepts #RRGGBB or #RRGGBBAA.
output_focus_color = "#707070"
# Occupied but currently unselected tags use this brighter label color.
occupied = "#d0d0d0"
# Each entry is executed through /bin/sh. Its trimmed stdout becomes one right-aligned status
# block; keep these commands fast because they run on the compositor thread.
status_commands = ["date '+%Y-%m-%d %H:%M'"]
refresh_interval_ms = 1000

# Optional NetworkManager widget. Install NetworkManager, Alacritty and
# Nerd Fonts Symbols Mono, then enable to show an actual clickable icon.
# Wired connection takes precedence over Wi-Fi. Click opens the interactive
# NetworkManager Wi-Fi selector; no elevated permissions or hidden daemon.
[bar.network]
enabled = false
icon_font = "Symbols Nerd Font Mono"
click_command = "alacritty -e nmtui-connect"
refresh_interval_ms = 5000

[floating]
# In global Floating mode (or for a rule-floating window), hold the configured modifier and drag:
# left moves, right resizes both axes, middle resizes vertically, Shift+right horizontally.
# A parented xdg-toplevel is a dialog. Keeping this enabled prevents file choosers, confirmation
# boxes and similar transient windows from consuming a master/stack slot.
dialogs = true
# Newly floating windows start centered at this logical size. Anvil clamps both values to the
# current output, so the window remains reachable on smaller screens.
default_width = 800
default_height = 600

# Rules are evaluated from top to bottom and the last matching rule wins. app_id and title use
# case-insensitive matching; `*` matches any number of characters. If both fields are present,
# both must match. This Steam rule covers Settings and similarly named utility windows.
[[window_rules]]
app_id = "steam"
title = "*settings*"
floating = true

# Add more rules in the same form, for example:
# [[window_rules]]
# app_id = "org.gnome.Calculator"
# floating = true
#
# A later `floating = false` rule can deliberately return a matching dialog to the tile layout.

# Optional unmodified multimedia hardware keys. Commands run through /bin/sh.
# Empty defaults let applications handle media keys unless explicitly configured.
# Kova Linux sets these to kova-osd; vanilla Anvil has no audio dependency.
[media]
# volume_up = "wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+"
# volume_down = "wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-"
# volume_mute = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
# brightness_up = "brightnessctl set +5%"
# brightness_down = "brightnessctl set 5%-"

[keys]
modifier = "Super"
terminal = "Return"
quit = "q"
focus_next = "j"
focus_previous = "k"
# Super+, / Super+. focus the previous/next output. Add Shift to move the focused window there.
output_previous = "comma"
output_next = "period"
# Open the fuzzy .desktop application launcher.
launcher = "p"
# Super+Space cycles []= tiling, [ ] fullscreen/monocle and ><> floating.
layout_mode = "space"
swap_master = "Return"
master_grow = "l"
master_shrink = "h"
close = "c"
