name: Trim Anvil image

on:
  push:
    branches:
      - trim-anvil-image

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: trim-anvil-image

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick

      - name: Trim image and keep a minimal border
        shell: bash
        run: |
          set -euo pipefail
          before="$(identify -format '%wx%h' anvil.png)"
          bg="$(convert anvil.png -format '%[pixel:p{0,0}]' info:)"
          convert anvil.png -fuzz 1% -trim +repage -bordercolor "$bg" -border 24x24 anvil.trimmed.png
          mv anvil.trimmed.png anvil.png
          after="$(identify -format '%wx%h' anvil.png)"
          echo "Trimmed anvil.png: $before -> $after"
          git rm .github/workflows/trim-anvil-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anvil.png
          git commit -m "Trim whitespace around anvil image ($before -> $after)"
          git push origin HEAD:trim-anvil-image
