name: CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Manual releases bump a version as before; an explicitly named release commit
# on main may publish a chosen semver (e.g. 'release: anvil v3.0.1').
# Serialize manual dispatches to avoid conflicting version bumps.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'anvil-release' || format('anvil-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Release runs always operate on the latest main branch even if the Run workflow dialog
          # was opened while another branch happened to be selected.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Install Smithay system dependencies
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror intermittently stalls package downloads; use Ubuntu's archive.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends \
            libegl1-mesa-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
          components: clippy, rustfmt

      - name: Verify formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Run Clippy
        run: cargo clippy --all-features --all-targets --locked -- -D warnings

      - name: Verify bar-free build
        # This is the user-facing opt-out contract: no extra feature flag may be necessary.
        run: cargo build --no-default-features --locked

      - name: Build ordinary CI binary
        if: github.event_name == 'pull_request'
        run: cargo build --release --all-features --locked

      - name: Upload ordinary CI binary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: anvil-${{ github.sha }}-x86_64-linux
          path: target/release/anvil
          if-no-files-found: error

  protocols:
    name: Nested protocols (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, default, layer-shell, all-features]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Install renderer and real-client test dependencies
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror intermittently stalls package downloads; use Ubuntu's archive.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends \
            libegl1-mesa-dev libgbm-dev libinput-dev libseat-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config xvfb grim waybar \
            fonts-dejavu-core ripgrep dbus-daemon xdotool wl-clipboard xwayland x11-utils
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
      - name: Build selected compositor
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          case "$PROFILE" in
            minimal) cargo build --no-default-features --locked ;;
            default) cargo build --locked ;;
            layer-shell) cargo build --no-default-features --features layer-shell --locked ;;
            all-features) cargo build --all-features --locked ;;
          esac
      - name: Build real Wayland test client
        run: tests/protocols/build.sh
      - name: Exercise compositor, capture and optional panels
        run: tests/protocols/run.sh '${{ matrix.profile }}'
      - name: Preserve protocol test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-tests-${{ matrix.profile }}
          path: |
            target/protocol-tests/*.log
            target/protocol-tests/*.png
            target/protocol-tests/*.json
          if-no-files-found: ignore

  footprint:
    name: Footprint (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, default, all-features, default-xwayland]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Install build dependencies
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror intermittently stalls package downloads; use Ubuntu's archive.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends \
            libegl1-mesa-dev libgbm-dev libinput-dev libseat-dev libudev-dev \
            libwayland-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
      - name: Verify regression comparison policy
        run: python3 tests/footprint/test_check.py
      - name: Measure all supported feature profiles
        run: python3 tests/footprint/check.py --profile '${{ matrix.profile }}'
      - name: Preserve size and dependency report
        uses: actions/upload-artifact@v7
        with:
          name: binary-footprint-${{ matrix.profile }}
          path: target/footprint/

  release:
    name: Bump version and publish binary
    # Push-to-main release is an explicit, version-checked commit message; normal
    # source pushes remain CI-only. Manual workflow_dispatch still supports bumps.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: anvil v'))
    needs: [build, protocols, footprint]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Smithay system dependencies
        timeout-minutes: 5
        run: |
          # The runner's Azure mirror intermittently stalls package downloads; use Ubuntu's archive.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends \
            libegl1-mesa-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0

      - name: Calculate and write next semantic version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$current" ]]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi

          # A versioned push is only accepted if the package already declares
          # exactly that version. Avoid accidental upgrades during ordinary CI.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            next="${RELEASE_MESSAGE#release: anvil v}"
            if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "$RELEASE_MESSAGE" != "release: anvil v$next" ]] ||
               [[ "$next" != "$current" ]]; then
              echo "Release commit and Cargo.toml version do not match" >&2
              exit 1
            fi
          # A failed publish may already have pushed the version commit and tag.
          # Resume that same release rather than incrementing a second time.
          elif git rev-parse --verify --quiet "refs/tags/v$current" >/dev/null \
            && ! gh release view "v$current" >/dev/null 2>&1; then
            next="$current"
          else
            IFS=. read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) ((major += 1)); minor=0; patch=0 ;;
              minor) ((minor += 1)); patch=0 ;;
              patch) ((patch += 1)) ;;
              *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
            esac
            next="$major.$minor.$patch"

            # Only the package's first version declaration is replaced. Dependency versions remain
            # untouched; Cargo refreshes the root package entry in Cargo.lock during the build.
            sed -i "0,/^version = \"$current\"$/s//version = \"$next\"/" Cargo.toml
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Build release binary and refresh lockfile
        run: cargo build --release --all-features

      - name: Package binary and configuration
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package="anvil-$VERSION-x86_64-unknown-linux-gnu"
          mkdir "$package"
          install -m755 target/release/anvil "$package/anvil"
          install -m755 target/release/anvilctl "$package/anvilctl"
          install -m644 config.toml anvil.desktop README.md LICENSE NOTICE "$package/"
          tar -czf "$package.tar.gz" "$package"
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Commit version and create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Release $TAG"
          fi
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            git merge-base --is-ancestor "$TAG" HEAD
          else
            git tag -a "$TAG" -m "Anvil $VERSION"
          fi
          git push origin HEAD:main "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Anvil ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            anvil-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            anvil-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz.sha256
